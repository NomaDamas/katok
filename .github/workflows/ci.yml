name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          KATOK_EMBEDDER: local-test
        run: cargo test --all-targets

      - name: Check package
        run: cargo publish --dry-run

      - name: Verify release config
        run: python3 scripts/verify_release_config.py

      - name: Test history privacy gate
        run: bash tests/verify_history_privacy.sh

      - name: Verify Git history privacy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            revision="origin/${{ github.base_ref }}..HEAD"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            revision="HEAD"
          else
            revision="${{ github.event.before }}..${{ github.sha }}"
          fi
          python3 scripts/verify_history_privacy.py . "${revision}"
